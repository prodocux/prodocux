name: Publish release assets to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Mint publication preflight App token
        id: publication-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PDX_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PDX_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.publication-app.outputs.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ steps.publication-app.outputs.token }}
          persist-credentials: false
          path: release-source
      - name: Verify publication actor and Git attribution
        env:
          GH_TOKEN: ${{ steps.publication-app.outputs.token }}
          APP_SLUG: ${{ steps.publication-app.outputs.app-slug }}
        run: |
          set -euo pipefail
          expected_actor="${APP_SLUG:?Missing App slug}[bot]"
          bot="$(gh api "users/${expected_actor}" --jq '[.login, .type] | join("|")')"
          test "$bot" = "$expected_actor|Bot"
          test "$GITHUB_ACTOR" = "$expected_actor"
          test "$GITHUB_TRIGGERING_ACTOR" = "$expected_actor"
          team='ProDocuX Team <info@prodocux.com>'
          test "$(git -C release-source show -s --format='%an <%ae>' HEAD)" = "$team"
          test "$(git -C release-source show -s --format='%cn <%ce>' HEAD)" = "$team"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification tools
        run: python -m pip install --upgrade build twine
      - name: Test release source
        run: |
          cd release-source
          python -m pip install -e ".[dev]"
          pytest
          python scripts/verify_clean_install.py
      - name: Download approved GitHub Release assets
        env:
          GH_TOKEN: ${{ steps.publication-app.outputs.token }}
        run: |
          mkdir release-dist
          gh release download "$RELEASE_TAG" --dir release-dist --pattern "prodocux-*.whl" --pattern "prodocux-*.tar.gz"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
      - name: Verify metadata and GitHub SHA-256 digests
        run: |
          python -m twine check release-dist/*
          python scripts/verify_release_assets.py --tag "$RELEASE_TAG" --dist release-dist --release-json release.json --source release-source
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions-${{ env.RELEASE_TAG }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions-${{ github.event.release.tag_name || inputs.tag }}
          path: dist
      - name: Publish unchanged distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Wait for the published version on PyPI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://pypi.org/pypi/prodocux/${version}/json" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "PyPI did not expose prodocux ${version} after 300 seconds" >&2
          exit 1

  readme-closeout:
    needs: publish
    uses: ./.github/workflows/readme-after-publish.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
    secrets: inherit
