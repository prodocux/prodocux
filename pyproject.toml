[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prodocux"
version = "0.3.0rc1"
description = "ProDocuX Kernel — deterministic document processing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "python-docx==1.1.2",
    "pypdf==5.1.0",
    "cryptography>=42.0.0",
    "Pillow>=11.0.0",
    "pymupdf==1.25.1",
    "httpx==0.28.1",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "jsonschema>=4.22.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "prodocux_kernel*", "skills*"]

[tool.setuptools.package-data]
prodocux_kernel = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
